[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-monitor"
version = "0.1.0"
description = "Printer monitoring with Telegram notifications."
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.3",
  "requests>=2.32.5"
]
